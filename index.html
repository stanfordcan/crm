<!DOCTYPE html>
<html lang="zh-TW">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>借款客戶追蹤系統</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* Password screen */
.pw-screen{position:fixed;inset:0;background:#F5F4F0;z-index:9999;display:flex;align-items:center;justify-content:center;font-family:'Noto Sans TC',sans-serif}
.pw-box{background:#fff;border-radius:18px;padding:36px 28px;width:300px;max-width:90vw;box-shadow:0 4px 24px rgba(0,0,0,.08);text-align:center}
.pw-box h2{font-size:18px;font-weight:600;margin-bottom:6px;color:#1A1916}
.pw-box p{font-size:13px;color:#A09D96;margin-bottom:24px}
.pw-input{width:100%;background:#EFEDE8;border:1px solid #DDD9D0;border-radius:10px;padding:13px 16px;font-size:20px;font-family:inherit;outline:none;text-align:center;letter-spacing:6px;color:#1A1916;-webkit-appearance:none}
.pw-input:focus{border-color:#2B5BE2;background:#fff}
.pw-btn{width:100%;margin-top:14px;background:#2B5BE2;color:#fff;border:none;border-radius:10px;padding:13px;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit}
.pw-btn:active{opacity:.88}
.pw-error{color:#D63B3B;font-size:13px;margin-top:10px;display:none}
:root{--bg:#F5F4F0;--surface:#fff;--s2:#EFEDE8;--border:#DDD9D0;--text:#1A1916;--t2:#6B6860;--t3:#A09D96;--accent:#2B5BE2;--abg:#EDF1FC;--red:#D63B3B;--rbg:#FDECEC;--green:#1D8C5E;--gbg:#E8F7F1;--orange:#C46A00;--obg:#FFF3E0;--r:14px;--rs:8px;--sh:0 2px 12px rgba(0,0,0,.06)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Noto Sans TC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.sticky-top{position:sticky;top:0;z-index:50;background:var(--surface)}
.header{background:var(--surface);border-bottom:1px solid var(--border);padding:16px 16px 12px}
.header-top{display:flex;align-items:center;justify-content:center;margin-bottom:10px}
.header h1{font-size:20px;font-weight:700;letter-spacing:1px;text-align:center}
.hbtns{display:flex;gap:7px;overflow-x:auto;flex-wrap:nowrap;scrollbar-width:none;margin-bottom:10px;padding:0 2px 2px;justify-content:center}
.hbtns::-webkit-scrollbar{display:none}
.hbtn{border:none;border-radius:9px;padding:7px 13px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;white-space:nowrap;flex-shrink:0;box-shadow:0 1px 3px rgba(0,0,0,.07);transition:filter .15s,transform .1s}
.hbtn:hover{filter:brightness(.95)}
.hbtn:active{transform:scale(.95);opacity:.85}
.hbtn-sync{background:var(--s2);color:var(--t2)}
.hbtn-company{background:var(--gbg);color:var(--green)}
.hbtn-xls{background:var(--abg);color:var(--accent)}
.hbtn:active{opacity:.8}
.hbtn:disabled{opacity:.5}
.stats-bar{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:4px 2px 6px;justify-content:center}
.stats-bar::-webkit-scrollbar{display:none}
.spill{flex-shrink:0;background:var(--s2);border-radius:12px;padding:8px 16px;text-align:center;min-width:62px;transition:transform .1s}
.spill b{display:block;font-size:22px;font-weight:700;color:var(--text);line-height:1.15;letter-spacing:-.5px}
.spill span{display:block;font-size:10px;color:var(--t3);margin-top:2px;font-weight:500;letter-spacing:.3px}
.spill.alert{background:var(--rbg)}
.spill.alert b{color:var(--red)}
.spill.warn{background:var(--obg)}
.spill.warn b{color:var(--orange)}
.spill.info b{color:var(--accent)}
.tabs{background:var(--surface);border-bottom:1px solid var(--border);padding:0 4px;display:flex;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;scroll-behavior:smooth;flex:1}
.tabs::-webkit-scrollbar{display:none}
.tabs-wrap{position:relative;display:flex;align-items:center;background:var(--surface);border-bottom:1px solid var(--border)}
.tab-arrow{background:none;border:none;padding:0 6px;font-size:18px;cursor:pointer;color:var(--t3);flex-shrink:0;line-height:1}
.tab-arrow:hover{color:var(--accent)}
.tabs::-webkit-scrollbar{display:none}
.tbtn{flex-shrink:0;padding:9px 12px;font-size:12px;font-weight:500;color:var(--t3);border:none;background:none;cursor:pointer;border-bottom:2px solid transparent;font-family:inherit;white-space:nowrap}
.tbtn.active{color:var(--accent);border-bottom-color:var(--accent)}
.search-wrap{padding:10px 14px;background:var(--surface);border-bottom:1px solid var(--border)}
.search-input{width:100%;background:var(--s2);border:none;border-radius:var(--rs);padding:9px 13px;font-size:14px;color:var(--text);font-family:inherit;outline:none}
.list-wrap{flex:1;padding:10px 14px;display:flex;flex-direction:column;gap:8px;padding-bottom:88px}
/* Cards */
.ccard{background:var(--surface);border-radius:var(--r);box-shadow:var(--sh);padding:14px;cursor:pointer;border-left:4px solid transparent}
.ccard:active{opacity:.9}
.ccard.over{border-left-color:var(--red)}
.ccard.today{border-left-color:var(--green)}
.ccard.soon{border-left-color:#0369A1}
/* Pinned card */
.ccard.pinned{box-shadow:0 2px 14px rgba(245,158,11,.18);outline:1px solid rgba(245,158,11,.35)}
/* Heat-based left border (only when no remind-state border) */
.ccard.heat-hw:not(.over):not(.today):not(.soon){border-left-color:rgba(196,106,0,.55)}
.ccard.heat-hc:not(.over):not(.today):not(.soon){border-left-color:rgba(43,91,226,.45)}
.ccard.heat-hx:not(.over):not(.today):not(.soon){border-left-color:rgba(124,58,237,.45)}
.ccard.heat-hd:not(.over):not(.today):not(.soon){border-left-color:rgba(29,140,94,.45)}
.ccard.heat-hp:not(.over):not(.today):not(.soon){border-left-color:rgba(156,130,100,.45)}
.ctop{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:7px}
.cname{font-size:15px;font-weight:600}
.cphone{font-size:12px;color:var(--t2);margin-top:2px}
.hbadge{font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;flex-shrink:0;margin-left:6px;letter-spacing:.2px}
.hw{background:var(--obg);color:var(--orange)}
.hc{background:var(--abg);color:var(--accent)}
.hd{background:var(--gbg);color:var(--green)}
.hf{background:var(--s2);color:var(--t3)}
.hx{background:#F3E8FF;color:#7C3AED}
.hp{background:#F0EDE8;color:#7C6F5E}
.cmeta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:5px}
.mi{font-size:11px;color:var(--t2)}
.rchip{font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px}
.rc-over{background:var(--rbg);color:var(--red)}
.rc-today{background:var(--gbg);color:var(--green)}
.rc-soon{background:#E0F2FE;color:#0369A1}
.rc-ok{background:var(--abg);color:var(--accent)}
.clog{font-size:11px;color:var(--t2);border-top:1px solid var(--border);padding-top:6px;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{text-align:center;padding:50px 20px;color:var(--t3);font-size:13px}
.loading{text-align:center;padding:50px 20px;color:var(--t3);font-size:13px}
/* FAB */
.fab{position:fixed;bottom:22px;right:20px;width:52px;height:52px;background:var(--accent);color:#fff;border:none;border-radius:50%;font-size:24px;cursor:pointer;box-shadow:0 4px 18px rgba(43,91,226,.4);display:flex;align-items:center;justify-content:center;z-index:40;font-family:inherit}
.fab:active{transform:scale(.93)}
/* Toast */
.toast{position:fixed;bottom:85px;left:50%;transform:translateX(-50%);background:#1A1916;color:#fff;padding:9px 18px;border-radius:99px;font-size:12px;z-index:200;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
/* Bottom sheet */
.sbg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;align-items:flex-end}
.sbg.open{display:flex}
.sheet{background:var(--surface);border-radius:22px 22px 0 0;width:100%;height:60vh;min-height:30vh;max-height:95vh;display:flex;flex-direction:column;overflow:hidden;transition:none}
.shandle{width:40px;height:5px;background:var(--border);border-radius:99px;margin:10px auto;flex-shrink:0;cursor:grab;touch-action:none}
.sheader{padding:13px 18px 11px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);flex-shrink:0}
.stitle{font-size:16px;font-weight:600}
.xbtn{background:var(--s2);border:none;border-radius:50%;width:28px;height:28px;font-size:15px;cursor:pointer;color:var(--t2);display:flex;align-items:center;justify-content:center;font-family:inherit}
.stabs{display:flex;border-bottom:1px solid var(--border);flex-shrink:0;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.stabs::-webkit-scrollbar{display:none}
.stab{flex-shrink:0;padding:9px 14px;font-size:12px;font-weight:500;color:var(--t3);border:none;background:none;cursor:pointer;border-bottom:2px solid transparent;font-family:inherit;white-space:nowrap}
.stab.active{color:var(--accent);border-bottom-color:var(--accent)}
.sbody{flex:1;overflow-y:auto;padding:14px 18px 20px}
/* Form */
.frow{margin-bottom:12px}
.frow label{display:block;font-size:11px;font-weight:600;color:var(--t2);margin-bottom:5px;text-transform:uppercase;letter-spacing:.3px}
.frow input,.frow select,.frow textarea{width:100%;background:var(--s2);border:1px solid var(--border);border-radius:var(--rs);padding:10px 13px;font-size:14px;color:var(--text);font-family:inherit;outline:none;-webkit-appearance:none}
.frow input:focus,.frow select:focus,.frow textarea:focus{border-color:var(--accent);background:#fff}
.frow textarea{height:85px;resize:none;line-height:1.5}
.fg2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.rbox{background:var(--abg);border-radius:var(--rs);padding:13px;margin-bottom:12px;border:1px solid #C5D5F8}
.rbox>label{font-size:12px;font-weight:600;color:var(--accent);display:block;margin-bottom:9px}
/* Logs */
.log-list{display:flex;flex-direction:column;gap:7px;margin-bottom:12px}
.litem{background:var(--s2);border-radius:var(--rs);padding:11px 13px}
.ldate{font-size:11px;color:var(--t3);margin-bottom:3px;font-weight:600}
.ltext{font-size:13px;line-height:1.5;padding-right:26px}
.ldel{float:right;background:none;border:none;color:var(--t3);font-size:15px;cursor:pointer;margin-top:-1px}
/* Form section headers */
.form-section-hd{font-size:11px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.5px;margin:16px 0 8px;padding-top:12px;border-top:1px solid var(--border)}
.add-log{background:var(--s2);border-radius:var(--rs);padding:13px}
.add-log>label{font-size:11px;font-weight:600;color:var(--t2);display:block;margin-bottom:7px}
.alrow{display:flex;gap:7px;margin-bottom:7px}
.alrow input{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:7px;padding:8px 11px;font-size:13px;font-family:inherit;outline:none;-webkit-appearance:none}
.alrow input:first-child{flex:0 0 115px}
.albtn{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:7px;padding:9px;font-size:12px;font-weight:600;color:var(--accent);cursor:pointer;font-family:inherit}
/* Company data section */
.company-info{background:var(--s2);border-radius:var(--rs);padding:12px 13px;margin-bottom:12px}
.company-info-title{font-size:11px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.3px;margin-bottom:8px}
.company-row{font-size:12px;color:var(--t2);margin-bottom:4px;line-height:1.5}
.company-row b{color:var(--text);font-weight:500}
/* Footer */
.sfooter{padding:13px 18px;border-top:1px solid var(--border);display:flex;gap:9px;flex-shrink:0;background:var(--surface)}
.bdel{background:var(--rbg);color:var(--red);border:none;border-radius:var(--rs);padding:11px 14px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
.bsave{flex:1;background:var(--accent);color:#fff;border:none;border-radius:var(--rs);padding:11px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}
.bsave:disabled{opacity:.5}
/* Import modal */
.imbg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:150;align-items:center;justify-content:center;padding:18px}
.imbg.open{display:flex}
.immodal{background:var(--surface);border-radius:var(--r);padding:22px 18px;width:100%;max-width:420px}
.immodal h3{font-size:15px;font-weight:600;margin-bottom:5px}
.immodal p{font-size:12px;color:var(--t2);margin-bottom:14px;line-height:1.6}
.imdrop{border:2px dashed var(--border);border-radius:var(--rs);padding:26px 16px;text-align:center;cursor:pointer;margin-bottom:12px}
.imdrop:hover{border-color:var(--accent);background:var(--abg)}
.imdrop .icon{font-size:28px;margin-bottom:6px}
.imdrop p{font-size:12px;color:var(--t3);margin:0}
.imdrop input{display:none}
.imprev{background:var(--s2);border-radius:var(--rs);padding:11px 13px;font-size:12px;margin-bottom:12px;display:none}
.imbtns{display:flex;gap:9px}
.imcancel{flex:1;background:none;border:1px solid var(--border);border-radius:var(--rs);padding:10px;font-size:13px;cursor:pointer;font-family:inherit;color:var(--t2)}
.imgo{flex:2;background:var(--green);color:#fff;border:none;border-radius:var(--rs);padding:10px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
.imgo:disabled{opacity:.5}
/* ── Dark Mode ────────────────────────────────────────────── */
@media(prefers-color-scheme:dark){
  :root{
    --bg:#1C1B18;--surface:#252420;--s2:#2E2C28;--border:#3A3830;
    --text:#F0EDE8;--t2:#A09D96;--t3:#6B6860;
    --abg:#1E2A4A;--rbg:#3A1A1A;--gbg:#1A3028;--obg:#3A2800;
    --sh:0 2px 12px rgba(0,0,0,.3)
  }
  .pw-screen{background:#1C1B18}
  .pw-box{background:#252420}
  .pw-input{background:#2E2C28;color:#F0EDE8}
}
/* ── PC Layout (≥900px) ───────────────────────────────── */
@media(min-width:900px){
  html,body{height:100%;overflow:hidden}
  .pc-container{display:flex;height:100vh;overflow:hidden}

  /* 左側面板：比例寬度，跟著螢幕縮放 */
  .pc-container .app{
    width:45%;min-width:440px;max-width:600px;
    flex-shrink:0;height:100vh;overflow-y:auto;
    border-right:2px solid var(--border);
    margin:0;min-height:unset;
    background:var(--bg);
  }

  /* PC 按鈕列 */
  .pc-container .hbtn{font-size:12px;padding:7px 12px}

  /* 統計列可換行 */
  .pc-container .stats-bar{flex-wrap:wrap;gap:5px;padding:4px 0}
  .pc-container .spill{font-size:12px;padding:5px 12px}

  /* 卡片間距與內距加大 */
  .pc-container .list-wrap{padding:14px 18px 30px;gap:10px}
  .pc-container .ccard{padding:16px 18px;border-radius:12px}
  .pc-container .cname{font-size:16px}

  /* 右側面板：編輯表單 */
  .pc-container .sbg{
    position:static!important;flex:1;
    background:transparent!important;
    display:flex!important;
    align-items:stretch;height:100vh;
    overflow:hidden;z-index:1;
  }
  .pc-container .sbg:not(.open) .sheet{display:none}
  #pcEmptyState{display:none}
  @media(min-width:900px){
    .pc-container .sbg:not(.open) #pcEmptyState{display:flex;width:100%;align-items:center;justify-content:center;padding:40px}
    .pc-container .sbg.open #pcEmptyState{display:none}
  }
  .pc-container .sheet{
    border-radius:0!important;
    height:100%!important;max-height:100%!important;
    width:100%!important;
    box-shadow:none;
  }
  .pc-container .shandle{display:none}

  /* FAB 固定在左側欄右下角 */
  .fab{left:calc(min(45vw,600px) - 72px);right:auto}

  /* PC 表單兩欄排版 */
  .pc-container #sp0,
  .pc-container #sp1 {
    column-count:2;
    column-gap:20px;
  }
  .pc-container #sp0>*,
  .pc-container #sp1>* {
    break-inside:avoid;
    -webkit-column-break-inside:avoid;
  }
  /* 提醒區塊、區段標題跨兩欄 */
  .pc-container .rbox,
  .pc-container .form-section-hd {
    column-span:all;
  }
  /* PC 熱度徽章稍大 */
  .pc-container .hbadge{font-size:13px;padding:4px 12px}
  /* PC 卡片內身分證欄位較明顯 */
  .pc-container .ccard .mi{font-size:12px}
}
</style>
</head>
<body>
<!-- Password Screen -->
<div class="pw-screen" id="pwScreen">
  <div class="pw-box">
    <h2>📋 客戶追蹤系統</h2>
    <p>請輸入密碼以繼續</p>
    <input class="pw-input" id="pwInput" type="password" placeholder="••••••" maxlength="10"
      onkeydown="if(event.key==='Enter')checkPw()"/>
    <button class="pw-btn" onclick="checkPw()">進入</button>
    <div class="pw-error" id="pwError">密碼錯誤，請再試一次</div>
  </div>
</div>
<script>
const PW = '870612';
const PW_KEY = 'crm_auth';
function checkPw(){
  const input = document.getElementById('pwInput').value;
  if(input === PW){
    sessionStorage.setItem(PW_KEY, '1');
    document.getElementById('pwScreen').style.display='none';
    document.getElementById('mainApp').style.display='flex';
  } else {
    document.getElementById('pwError').style.display='block';
    document.getElementById('pwInput').value='';
    document.getElementById('pwInput').focus();
  }
}
// Auto-unlock if already authenticated this session
if(sessionStorage.getItem(PW_KEY)==='1'){
  document.getElementById('pwScreen').style.display='none';
  document.addEventListener('DOMContentLoaded', function(){
    document.getElementById('mainApp').style.display='flex';
  });
}
</script>
<div class="pc-container">
<div class="app" id="mainApp" style="display:none">
  <div class="sticky-top">
  <div class="header">
    <div class="header-top">
      <h1>📋 客戶追蹤系統</h1>
    </div>
    <div class="hbtns">
      <button class="hbtn hbtn-company" id="companyBtn" onclick="syncFromCompany()">🏢 從總檔更新</button>
      <button class="hbtn hbtn-xls" onclick="openImport()">📥 XLS 匯入</button>
      <button class="hbtn hbtn-sync" id="syncBtn" onclick="syncData()">🔄 同步</button>
      <button class="hbtn hbtn-sync" onclick="openBlacklist()">黑名單<span id="blCount"></span></button>
      <button class="hbtn" style="background:#FDECEC;color:#D63B3B;box-shadow:0 1px 3px rgba(214,59,59,.12)" onclick="clearAllData()">🗑️ 清除</button>
    </div>
    <div class="stats-bar" id="statsBar"></div>
  </div>
  <div class="tabs-wrap">
    <button class="tab-arrow tab-arrow-left" onclick="scrollTabs(-150)">&#8249;</button>
    <div class="tabs" id="tabsWrap"></div>
    <button class="tab-arrow tab-arrow-right" onclick="scrollTabs(150)">&#8250;</button>
  </div>
  <div class="search-wrap" style="display:flex;gap:8px;flex-wrap:wrap">
    <input class="search-input" id="searchInput" placeholder="🔍 搜尋姓名、電話、身分證、備註…" oninput="render()" style="flex:1;min-width:120px"/>
    <select id="sortSelect" onchange="render()" style="background:var(--s2);border:none;border-radius:var(--rs);padding:9px 10px;font-size:13px;color:var(--text);font-family:inherit;outline:none;flex-shrink:0">
      <option value="remind">📅 提醒日期</option>
      <option value="deadline">⏰ 到期最近</option>
      <option value="heat">🔥 熱度</option>
      <option value="created">🕐 新增時間</option>
      <option value="addr">📍 地址縣市</option>
    </select>
    <div style="position:relative;flex-shrink:0">
      <button id="cityFilterBtn" onclick="toggleCityFilter()" style="background:var(--s2);border:none;border-radius:var(--rs);padding:9px 10px;font-size:13px;color:var(--text);font-family:inherit;cursor:pointer;white-space:nowrap">🗺️ 縣市 <span id="cityFilterCount"></span></button>
      <div id="cityFilterPanel" style="display:none;position:absolute;top:100%;right:0;margin-top:4px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:12px;width:280px;box-shadow:var(--sh);z-index:60;max-height:320px;overflow-y:auto">
        <div style="display:flex;justify-content:space-between;margin-bottom:10px">

// ── Storage ───────────────────────────────────────────────
function normalizeDate(val) {
  if(!val && val !== 0) return '';
  const s = String(val).trim();
  if(!s || s === '0') return '';
  if(/^\d{4}-\d{2}-\d{2}$/.test(s)) {
    return s >= '2000-01-01' ? s : '';
  }
  if(/^\d{4}-\d{2}-\d{2}T/.test(s)) {
    const d = s.slice(0,10);
    return d >= '2000-01-01' ? d : '';
  }
  const n = parseFloat(s);
  if(!isNaN(n) && n > 36526) {
    const d = new Date(Math.round((n - 25569) * 86400 * 1000));
    return d.toISOString().slice(0,10);
  }
  return '';
}

function normalizeTime(val) {
  if(!val) return '';
  const s = String(val).trim();
  // 已經是 HH:MM 格式
  if(/^\d{2}:\d{2}$/.test(s)) return s;
  // HH:MM:SS 格式
  if(/^\d{2}:\d{2}:\d{2}/.test(s)) return s.slice(0,5);
  // Excel 小數時間（0~1之間）
  const n = parseFloat(s);
  if(!isNaN(n) && n >= 0 && n < 1) {
    const totalMin = Math.round(n * 24 * 60);
    const h = Math.floor(totalMin / 60).toString().padStart(2,'0');
    const m = (totalMin % 60).toString().padStart(2,'0');
    return `${h}:${m}`;
  }
  return '';
}

function fixPhone(val) {
  if(!val) return '';
  const s = String(val).trim();
  if(/^[9]\d{8}$/.test(s)) return '0'+s;
  if(/^\d{9}$/.test(s)) return '0'+s;
  return s;
}

function saveLocal() {

}
function loadLocal() {
  try {
    const d = JSON.parse(localStorage.getItem(LOCAL_KEY)||'null');
    if(d){
      clients = (d.clients||[]).map(c => ({
        ...c,
        remind: normalizeDate(c.remind),
        remindTime: normalizeTime(c.remindTime),
        logs: (c.logs||[]).map(l => ({...l, date: normalizeDate(l.date)})),
      }));
      nextId = d.nextId||1;
    }
  } catch(e){}
}

// ── Auto-classify ────────────────────────────────────────
function autoClassify() {
  const cutoff = new Date();
  cutoff.setDate(cutoff.getDate() - 7);
  const CUTOFF = cutoff.toISOString().slice(0,10);
  let changed = false;
  clients.forEach(c => {
    // 舊資料遷移：追很緊 → 覆訪
    if(c.heat === '追很緊') {
      c.heat = '覆訪';
      changed = true;
    }
    // 超過7天未分類的「最新資料」→「待分類」
    if(c.heat === '最新資料' && c.createdAt && c.createdAt <= CUTOFF) {
      c.heat = '待分類';
      changed = true;
    }
  });
  if(changed) saveLocal();
}

// ── Blacklist ─────────────────────────────────────────────
function saveBlacklist() {

  try {
    const d = JSON.parse(localStorage.getItem(BLACKLIST_KEY)||'null');
    if(Array.isArray(d)) blacklist = d;
  } catch(e){}
  updateBlacklistBtn();
}
function addToBlacklist(c) {
  const phone = (c.phone||'').replace(/[-\s]/g,'');
  const idno  = (c.idno||'').toUpperCase();
  // avoid duplicate entries
  const already = blacklist.some(b => {
    const bp = (b.phone||'').replace(/[-\s]/g,'');
    if(phone && phone.length>5 && bp && phone===bp) return true;
    if(idno  && idno.length>5  && b.idno && idno===b.idno.toUpperCase()) return true;
    return false;
  });
  if(!already) {
    blacklist.push({ phone:c.phone||'', name:c.name||'', idno:c.idno||'', deletedAt:TODAY });
    saveBlacklist();
    updateBlacklistBtn();
  }
}
function isBlacklisted(phone, idno) {
  const np = (phone||'').replace(/[-\s]/g,'');
  const ni = (idno||'').toUpperCase();
  return blacklist.some(b => {
    const bp = (b.phone||'').replace(/[-\s]/g,'');
    if(np && np.length>5 && bp && np===bp) return true;
    if(ni && ni.length>5 && b.idno && ni===b.idno.toUpperCase()) return true;
    return false;
  });
}

// ── Google Sheets sync ────────────────────────────────────

// ── Sync ──────────────────────────────────────────────────
function parseVisitLogs(text){
  if(!text) return [];
  const curYear = new Date().getFullYear();
  const logs = [];

  // 用日期pattern切割
  const datePattern = /(?=(?:\d{3}\/\d{1,2}\/\d{1,2}|\d{7}|\d{6}|\d{4}(?!\d)))/g;
  const parts = text.split(datePattern).map(s=>s.trim()).filter(Boolean);

  parts.forEach(part => {
    if(!part) return;
    let date='', time='', content=part;

    // 7位民國 YYYMMDD + 可選時間4位
    let m = part.match(/^(\d{3})(\d{2})(\d{2})\s*(\d{4})?\s*/);
    if(m && parseInt(m[1]) > 90){
      date = `${parseInt(m[1])+1911}-${m[2]}-${m[3]}`;
      if(m[4]) time = `${m[4].slice(0,2)}:${m[4].slice(2)}`;
      content = part.slice(m[0].length).trim();
    }
    // 民國斜線 YYY/M/D
    else if((m = part.match(/^(\d{2,3})\/(\d{1,2})\/(\d{1,2})\s*/))){
      date = `${parseInt(m[1])+1911}-${String(m[2]).padStart(2,'0')}-${String(m[3]).padStart(2,'0')}`;
      content = part.slice(m[0].length).trim();
    }
    // 6位 YYMMDD
    else if((m = part.match(/^(\d{2})(\d{2})(\d{2})\s*(\d{4})?\s*/))){
      const yr = parseInt(m[1]);
      date = `${yr < 30 ? 2000+yr : 1900+yr+11}-${m[2]}-${m[3]}`;
      if(m[4]) time = `${m[4].slice(0,2)}:${m[4].slice(2)}`;
      content = part.slice(m[0].length).trim();
    }
    // 4位月日 + 4位時間 MMDD HHMM
    else if((m = part.match(/^(\d{2})(\d{2})\s+(\d{2})(\d{2})\s+/))){
      date = `${curYear}-${m[1]}-${m[2]}`;
      time = `${m[3]}:${m[4]}`;
      content = part.slice(m[0].length).trim();
    }
    // 4位月日 MMDD
    else if((m = part.match(/^(\d{2})(\d{2})(?!\d)\s*/))){
      date = `${curYear}-${m[1]}-${m[2]}`;
      content = part.slice(m[0].length).trim();
    }

    if(content) logs.push({ date: date||TODAY, time, text: content });
  });

  return logs.reverse();
}

function jsonpFetch(url) {
  return new Promise((resolve, reject) => {
    const cb = '_cb' + Date.now() + Math.floor(Math.random()*1000);
    const s = document.createElement('script');
    const t = setTimeout(() => {
      cleanup();
      reject(new Error('Timeout'));
    }, 15000);
    window[cb] = (data) => {
      cleanup();
      resolve(data);
    };
    s.onerror = () => {
      cleanup();
      reject(new Error('載入失敗'));
    };
    function cleanup() {
      clearTimeout(t);
      delete window[cb];
      if(s.parentNode) s.parentNode.removeChild(s);
    }
    s.src = url + (url.includes('?') ? '&' : '?') + 'callback=' + cb;
    document.head.appendChild(s);
  });
}

function processCompanyData(raw) {
  if(!raw||raw.length<3){showToast('⚠️ 總檔沒有資料');return;}

  // Row 0: short headers, Row 1: full headers, Row 2+: data
  const rows = raw.slice(2);

  // Sheet name → heat mapping (last column of each row)
  function sheetToHeat(sheetName) {
    const s = (sheetName||'').trim();
    if(/無效|斷聯|塗銷/.test(s)) return '無效案件';
    if(/簽約/.test(s)) return '已簽約';
    if(/新鑫/.test(s)) return '新鑫';
    return '最新資料'; // 所有匯入資料預設為最新資料
  }

  // Detect if row is 新鑫 format (col1 looks like ID number, col2 looks like phone)
  function isXinXinRow(row) {
    return String(row[6]||'').trim() === '新鑫';
  }

  function processXinXinRow(row) {
    const name = String(row[0]||'').trim();
    const phone = String(row[2]||'').trim().replace(/[^\d-]/g,'');
    const addr = String(row[3]||'').trim();
    const note = String(row[4]||'').trim();
    return { name, phone, addr, note };
  }

  // Column indices (confirmed from real data):
  // 0 = 電話欄（含姓名+電話，換行分隔）
  // 1 = 拜訪過程
  // 2 = 備註
  // 4 = 門牌地址
  // 5 = 面積
  // 6 = 建物所有權部（含所有權人姓名）
  // 13 = 他項權利部（含銀行/民間金額）

  let added=0, updated=0, skipped=0;
  let xinXinBatchDate = ''; // 追蹤新鑫批次日期

  rows.forEach(row => {
    const sheetName = String(row[row.length-1]||'').trim();

    // 新鑫格式處理
    if(sheetName === '新鑫') {
      const name = String(row[0]||'').trim();

      // 偵測批次日期行
      if(!name || name.includes('_資料') || /^\d{4}-\d{2}-\d{2}/.test(name)) {
        const dateMatch = name.match(/^(\d{7})/) || name.match(/^(\d{4}-\d{2}-\d{2})/);
        const bracketMatch = name.match(/\((\d+)\)/);
        const bracketNum = bracketMatch ? `（${bracketMatch[1]}）` : '';
        if(dateMatch) {
          const raw = dateMatch[1];
          if(raw.length === 7) {
            const y = parseInt(raw.slice(0,3)) + 1911;
            const m = raw.slice(3,5);
            const d = raw.slice(5,7);
            xinXinBatchDate = `${y}/${m}/${d}${bracketNum}`;
          } else {
            xinXinBatchDate = raw + bracketNum;
          }
        }
        return;
      }

      const phone = String(row[2]||'').replace(/[^\d-]/g,'').trim();
      const addr  = String(row[3]||'').trim();
      const note  = String(row[4]||'').trim();
      // 新鑫第1欄是身分證字號
      const xinIdno = String(row[1]||'').trim().match(/([A-Z]\d{9})/)?.[1] || '';
      const fullNote = [xinXinBatchDate ? `批次：${xinXinBatchDate}` : '', note].filter(Boolean).join('｜');
      const normPhone = phone.replace(/[-\s]/g,'');

      // 如果地址是空白，合併到上一筆同電話或同名的新鑫客戶
      if(!addr && clients.length > 0) {
        const prev = clients[clients.length - 1];
        const prevPhone = String(prev.phone||'').replace(/[-\s]/g,'');
        const samePhone = normPhone && prevPhone && prevPhone === normPhone;
        const sameName = name && prev.name && (prev.name===name || prev.name.includes(name));
        if(prev.heat === '新鑫' && (samePhone || sameName || !phone)) {
          if(name && !prev.name.includes(name)) {
            prev.name = prev.name + '／' + name;
          }
          if(phone && !(prev.debtPhones||[]).some(p=>p.includes(phone))) {
            prev.debtPhones = [...(prev.debtPhones||[]), phone + `（${name}）`];
          }
          prev.updatedAt = TODAY;
          updated++;
          return;
        }
      }

      const existing = clients.find(c=>{
        if(c.phone && normPhone && String(c.phone).replace(/[-\s]/g,'')=== normPhone) return true;
        if(name && c.name===name) return true;
        return false;
      });
      if(isBlacklisted(phone, xinIdno)){ skipped++; return; }
      if(existing){
        if(!existing.addr && addr) existing.addr = addr;
        if(fullNote && !existing.note) existing.note = fullNote;
        if(!existing.idno && xinIdno) existing.idno = xinIdno;
        existing.heat = '新鑫';
        existing.updatedAt = TODAY;
        updated++;
      } else {
        clients.push({
          id: nextId++,
          name, phone, idno: xinIdno, addr,
          debtPhones: [],
          heat: '新鑫',
          remind: '', remindTime: '', remindNote: '',
          job: '', jobYears: '', finProofs: [],
          note: fullNote, area: 0, bank: 0, private: 0, legal: 0,
          purpose: '', buildNo: '',
          logs: fullNote ? [{date: TODAY, text: fullNote}] : [],
          companyRaw: null,
          createdAt: TODAY, updatedAt: TODAY,
        });
        added++;
      }
      return;
    }

    const rawCell = String(row[0]||'').trim();
    const ownerCheck = String(row[6]||'').trim();
    const buildCheck = String(row[3]||'').trim();
    // Only skip if 標示部 AND 所有權部 are both empty
    if(!ownerCheck && !buildCheck) return;

    // Extract confirmed phones from col 0
    const phoneMatches = rawCell.match(/0\d[\d-]{7,}/g) || [];
    const landlines = rawCell.match(/0[2-9]\d-?\d{4}-?\d{4}/g) || [];
    const allPhones = [...new Set([...phoneMatches, ...landlines])];
    const phone = allPhones[0] || '';

    // Extract debt phones from col 12 (債電), deduplicate against confirmed phones
    const debtRaw = String(row[12]||'').trim();
    const debtMatches = debtRaw.match(/0\d[\d-]{7,}/g) || [];
    const debtLandlines = debtRaw.match(/0[2-9]\d-?\d{4}-?\d{4}/g) || [];
    const allDebtPhones = [...new Set([...debtMatches, ...debtLandlines])].filter(p =>
      !allPhones.some(op => op.replace(/[-\s]/g,'') === p.replace(/[-\s]/g,''))
    );

    // Extract name - always prioritize owner column (col 6)
    const ownerRaw = String(row[6]||'');
    // Match full ID: A123456789 姓名, or masked ID: A221*****8 江＊＊ or A221*****8 江某某
    const ownerNameMatch = ownerRaw.match(/[A-Z]\d[\d*]{7,9}[\d*]\s+([\u4e00-\u9fff＊*]{2,8})/);
    let ownerName = ownerNameMatch ? ownerNameMatch[1].replace(/[＊*]/g,'') : '';
    // Remove if only asterisks remain
    if(ownerName.length < 1) ownerName = '';

    // If name is masked or missing, fallback to restriction col (col 18) for 義務人
    const isMasked = !ownerName || ownerName.includes('*') || ownerName.includes('＊');
    if (isMasked) {
      const restrictRaw = String(row[18]||'');
      const obligorMatch = restrictRaw.match(/義務人[：:]\s*([\u4e00-\u9fff]{2,8})/);
      if (obligorMatch) ownerName = obligorMatch[1];
    }

    // Final fallback: try debt column (col 9)
    if(!ownerName) {
      const debtRaw = String(row[9]||'');
      const debtMatch = debtRaw.match(/^([\u4e00-\u9fff]{2,6})[、，]/);
      if(debtMatch) ownerName = debtMatch[1];
    }

    const name = (ownerName || '（未知）').trim();

    // 從所有權部抓身分證字號
    const idnoMatch = ownerRaw.match(/([A-Z]\d{9})/);
    const idno = idnoMatch ? idnoMatch[1] : '';

    if(!phone && !name) { skipped++; return; }

    // Parse bank/legal/private from rights column (col 13)
    const rightsRaw = String(row[13]||'');
    let bank=0, priv=0, legal=0;

    // Extract each entry - support both formats:
    // 【銀】102-02-20 ... and 【銀】民國110年08月04日...
    const entries = rightsRaw.split('\n').filter(l=>l.match(/【[銀私法]】/));
    entries.forEach(line => {
      // Match amount in various formats
      const amtMatch = line.match(/新臺幣\s*([\d,]+)\s*元|（新臺幣([\d,]+)元）|（([\d,]+)）|\(([\d,]+)\)/);
      const amt = amtMatch ? Math.round(parseInt((amtMatch[1]||amtMatch[2]||amtMatch[3]||amtMatch[4]||'0').replace(/,/g,''))/10000) : 0;
      if(!amt) return;

      if(line.includes('【銀】')) {
        // Check if it's actually a legal entity (not a bank)
        const isRealBank = /銀行|農會|信合社|信用合作|漁會/.test(line);
        const isLegal2 = !isRealBank && /股份有限|有限公司|企業|租賃|迪和|新鑫|和勁|華財/.test(line);
        if(isLegal2) legal += amt;
        else bank += amt; // 先累加，最後再除1.2
      } else if(line.includes('【私】') || line.includes('【法】')) {
        const creditorMatch = line.match(/最高\s+(.+?)\s+[\dA-Z]{8,}/) ||
                              line.match(/[\dA-Z]{8,}\s+([\u4e00-\u9fff（）\s]{2,20})\s+新臺幣/);
        const creditor = creditorMatch ? creditorMatch[1] : line;
        const isBank = /銀行|農會|信合社|信用合作|漁會/.test(creditor);
        const isLegal = !isBank && /股份有限|有限公司|企業|租賃|迪和|新鑫|和勁|華財/.test(creditor);
        if(isBank) bank += amt;
        else if(isLegal) legal += amt;
        else priv += amt;
      }
    });

    // 銀行、法人金額 ÷ 1.2，無條件進位到整數萬
    function calcAmt(b) {
      return Math.ceil(b / 1.2);
    }
    bank = calcAmt(bank);
    legal = calcAmt(legal);

    // Fallback: use summary line if entry parsing got nothing
    if(!bank && !priv && !legal) {
      const bankMatch  = rightsRaw.match(/銀行[：:]\s*([\d,]+)/);
      const privMatch  = rightsRaw.match(/民間[：:]\s*([\d,]+)/);
      const legalMatch = rightsRaw.match(/法人[：:]\s*([\d,]+)/);
      const rawBank  = bankMatch  ? parseInt(bankMatch[1].replace(/,/g,''))/10000 : 0;
      const rawLegal = legalMatch ? parseInt(legalMatch[1].replace(/,/g,''))/10000 : 0;
      bank  = Math.ceil(rawBank  / 1.2);
      legal = Math.ceil(rawLegal / 1.2);
      priv  = privMatch  ? Math.round(parseInt(privMatch[1].replace(/,/g,''))/10000) : 0;
    }

    // Parse area (col 5)
    // 從標示部解析總面積、主建物、附屬、公設
    const buildInfo3 = String(row[3]||'').replace(/\n/g,' ');
    const areaRaw = String(row[5]||'');
    const areaFromBI = parseFloat((buildInfo3.match(/[（(]([\d.]+)坪[）)]/)||[])[1])||0;
    const areaFromCol5 = parseFloat((areaRaw.match(/[（(]([\d.]+)坪[）)]/)||areaRaw.match(/([\d.]+)坪/)||[])[1])||0;
    const mainArea   = parseFloat((buildInfo3.match(/主建\(([\d.]+)\)/)||[])[1])||0;
    const subArea    = parseFloat((buildInfo3.match(/附屬\(([\d.]+)\)/)||[])[1])||0;
    const commonArea = parseFloat((buildInfo3.match(/公設\(([\d.]+)/)||[])[1])||0;
    // 總面積：優先從標示部抓，若無則用主建+附屬+公設加總
    const areaCalc = mainArea + subArea + commonArea;
    const area = areaFromBI || areaFromCol5 || (areaCalc > 0 ? Math.round(areaCalc*100)/100 : 0);

    // Address (col 4)
    const addr = String(row[4]||'').replace(/\n/g,' ').trim();

    // Extract buildInfo from col 3 (for display only)
    const buildInfo = String(row[3]||'').trim();

    // 從共同擔保建號（col 11）解析建號，去重複只留編號
    const guaranteeRaw = String(row[11]||'');
    const buildSection = guaranteeRaw.match(/共同擔保建號[：:]([\s\S]*?)$/);
    let buildNo = '';
    if(buildSection){
      const lines = buildSection[1].split('\n');
      const seen = new Set(); const result = [];
      lines.forEach(line=>{
        line = line.trim(); if(!line) return;
        const parts = line.split(/\s+/);
        if(parts.length >= 2){
          const no = parts[1]; // 第二個token是建號
          if(!seen.has(no)){seen.add(no);result.push(no);}
        }
      });
      buildNo = result.join('、');
    }
    // 備用：從標示部抓建號
    if(!buildNo){
      const buildNoMatch = buildInfo.match(/([A-Z]_\d+_\d+_\d+-\d+)/);
      buildNo = buildNoMatch ? buildNoMatch[1] : '';
    }

    // 解析共同擔保地號，去重複，同時抓段名
    const landSection = guaranteeRaw.match(/共同擔保地號[：:]([\s\S]*?)(?=共同擔保建號|$)/);
    let landNos = '', sectionName = '';
    if(landSection){
      const lines = landSection[1].split('\n');
      const seen = new Set(); const result = [];
      const seenSection = new Set();
      lines.forEach(line=>{
        line = line.trim(); if(!line) return;
        const parts = line.split(/\s+/);
        if(parts.length >= 2){
          const no = parts[1];
          if(!seen.has(no)){seen.add(no);result.push(no);}
          if(parts[0] && !seenSection.has(parts[0])){seenSection.add(parts[0]);}
        }
      });
      landNos = result.join('、');
      sectionName = [...seenSection].join('、');
    }

    // Process log (col 1)
    const processText = String(row[1]||'').trim();
    const noteText    = String(row[2]||'').trim();

    // 如果電話欄空白且有建號，嘗試合併到上一筆相同建號的客戶
    if(!rawCell && buildNo && clients.length > 0) {
      const prevSameBuilding = clients.find(c =>
        c.buildNo && c.buildNo === buildNo
      );
      if(prevSameBuilding) {
        // 合併所有權人姓名
        if(name && name !== '（未知）' && !prevSameBuilding.name.includes(name)) {
          prevSameBuilding.name = prevSameBuilding.name + '／' + name;
        }
        // 合併債電
        if(allDebtPhones.length) {
          prevSameBuilding.debtPhones = [...(prevSameBuilding.debtPhones||[]), ...allDebtPhones];
        }
        prevSameBuilding.updatedAt = TODAY;
        updated++;
        return;
      }
    }

    const companyRaw = {
      phone: rawCell,
      process: processText,
      note: noteText,
      addr: addr,
      area: areaFromBI ? `${areaFromBI}坪` : areaRaw,
      owner: ownerRaw,
      rights: rightsRaw,
      buildInfo: buildInfo,
      allPhones: allPhones,
    };

    // Check if exists by any phone number OR (name + address)
    const normPhones = allPhones.map(p=>p.replace(/[-\s\(\)#]/g,''));
    const existing = clients.find(c => {
      // Match by phone (strongest signal)
      if(c.phone) {
        const cp = String(c.phone).replace(/[-\s\(\)#]/g,'');
        if(normPhones.some(p=>p&&cp&&p===cp)) return true;
      }
      // Match by name - only if address also matches or both have no address
      if(name && name!=='（未知）' && c.name === name) {
        const addrA = (c.addr||'').slice(0,10);
        const addrB = (addr||'').slice(0,10);
        // 都沒地址，或地址前10字相同，才視為同一人
        if(!addrA && !addrB) return true;
        if(addrA && addrB && addrA === addrB) return true;
      }
      return false;
    });

    // Get sheet name from last column and determine heat
    const heat = sheetToHeat(sheetName);

    if(isBlacklisted(phone, idno)){ skipped++; return; }

    if(existing){
      existing.companyRaw = companyRaw;
      if(!existing.addr && addr) existing.addr = addr;
      if(!existing.idno && idno) existing.idno = idno;
      if(bank && !existing.bank) existing.bank = bank;
      if(priv && !existing.private) existing.private = priv;
      if(legal && !existing.legal) existing.legal = legal;
      if(area && !existing.area) existing.area = area;
      if(mainArea && !existing.mainArea) existing.mainArea = mainArea;
      if(subArea && !existing.subArea) existing.subArea = subArea;
      if(commonArea && !existing.commonArea) existing.commonArea = commonArea;
      if(buildNo && !existing.buildNo) existing.buildNo = buildNo;
      if(landNos && !existing.landNo) existing.landNo = landNos;
      if(sectionName && !existing.purpose) existing.purpose = sectionName;
      // 熱度：只有在客戶是「最新資料」預設狀態時才跟總檔更新，避免覆蓋手動設定
      if(!existing.heat || existing.heat === '最新資料') existing.heat = heat;
      // 聯絡記錄：只加入新的，不恢復已刪除的
      if(processText){
        const newLogs = parseVisitLogs(processText);
        const existingKeys = new Set((existing.logs||[]).map(l=>(l.date||'')+(l.text||'').slice(0,20)));
        const deletedKeys = new Set(existing.deletedLogKeys||[]);
        const toAdd = newLogs.filter(l=>{
          const key = (l.date||'')+(l.text||'').slice(0,20);
          return !existingKeys.has(key) && !deletedKeys.has(key);
        });
        if(toAdd.length) existing.logs = [...toAdd, ...(existing.logs||[])].sort((a,b)=>(b.date||'').localeCompare(a.date||''));
      }
      if(allDebtPhones.length) existing.debtPhones = allDebtPhones;
      // driveUrl 不覆蓋，保留已建立的連結
      existing.heat = heat;
      existing.updatedAt = TODAY;
      updated++;
    } else {
      const logs = parseVisitLogs(processText);

      clients.push({
        id: nextId++,
        name, phone, idno,
        debtPhones: allDebtPhones,
        heat,
        remind: '', remindTime: '', remindNote: '',
        job: '', jobYears: '', finProofs: [],
        note: noteText,
        addr, area, mainArea, subArea, commonArea, parkArea: 0, bank, private: priv, legal,
        purpose: sectionName, buildNo, driveUrl: '', landNo: landNos,
        logs: logs.slice(0,3),
        companyRaw,
        createdAt: TODAY, updatedAt: TODAY,
      });
      added++;
    }
  });

  // 去除重複：同電話只保留一筆，同名要比對地址
  const seen = new Set();
  clients = clients.filter(c => {
    const normPhone = (c.phone||'').replace(/[-\s\(\)#]/g,'');
    const key1 = normPhone && normPhone.length > 5 ? 'p_'+normPhone : null;
    // 同名同地址才算重複
    const addrKey = (c.addr||'').slice(0,10);
    const key2 = c.name && c.name !== '（未知）' ? 'n_'+c.name+'_'+addrKey : null;
    if((key1 && seen.has(key1)) || (key2 && seen.has(key2))) return false;
    if(key1) seen.add(key1);
    if(key2) seen.add(key2);
    return true;
  });

  autoClassify();
  saveLocal();
  pushToSheet().catch(()=>{});
  render();
  showToast(`✅ 總檔：新增 ${added} 筆，更新 ${updated} 筆，略過 ${skipped} 筆`);
}

function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2800);
}
function remSt(r){
  if(!r)return null;
  if(r<TODAY)return'over';
  if(r===TODAY)return'today';
  return(new Date(r)-new Date(TODAY))/86400000<=3?'soon':'ok';
}
function remChip(r,rt){
  if(!r)return'';
  const s=remSt(r);
  const ts=rt?` ${rt}`:'';
  const days=Math.ceil((new Date(r)-new Date(TODAY))/86400000);
  let label='';
  if(s==='over') label=`⚠️ 逾期${ts}`;
  else if(s==='today') label=`📞 今天${ts}`;
  else if(days===1) label=`📅 明天${ts}`;
  else if(days===2) label=`📅 後天${ts}`;
  else if(days===3) label=`📅 3天後${ts}`;
  else label=`📅 ${r}${ts}`;
  const cls=s==='over'?'rc-over':s==='today'?'rc-today':s==='soon'?'rc-soon':'rc-ok';
  return`<span class="rchip ${cls}">${label}</span>`;
}
const hCls={'待分類':'hp','覆訪':'hw','最新資料':'hc','已簽約':'hd','無效案件':'hf','新鑫':'hx'};
const hOrd={'待分類':0,'覆訪':1,'最新資料':2,'新鑫':3,'已簽約':4,'無效案件':5};
const rOrd={over:0,today:1,soon:2,ok:3,null:4};

function updateStats(){
  const inactive = ['已簽約','無效案件'];
  // 逾期：提醒日已過，非結案
  const over = clients.filter(c=>c.remind&&c.remind<TODAY&&!inactive.includes(c.heat)).length;
  // 未排程：沒有提醒日，非結案（最容易被遺忘的一群）
  const noRemind = clients.filter(c=>!c.remind&&!inactive.includes(c.heat)).length;
  // 本週：今天起7天內有提醒（含今天）
  const weekEnd = new Date(); weekEnd.setDate(weekEnd.getDate()+7);
  const WEEK_END = weekEnd.toISOString().slice(0,10);
  const week = clients.filter(c=>c.remind&&c.remind>=TODAY&&c.remind<=WEEK_END).length;
  // 總計
  const total = clients.length;

  document.getElementById('statsBar').innerHTML=`
    <div class="spill ${over?'alert':''}"><b>${over}</b><span>⚠️ 逾期</span></div>
    <div class="spill ${noRemind?'warn':''}"><b>${noRemind}</b><span>📋 未排程</span></div>
    <div class="spill ${week?'info':''}"><b>${week}</b><span>📅 本週</span></div>
    <div class="spill"><b>${total}</b><span>👥 總計</span></div>
  `;

  document.title = over > 0 ? `(${over}) 借款追蹤系統` : '借款追蹤系統';
  // PC 空白統計
  const s=id=>document.getElementById(id);

  if(s('pc_over_num'))  s('pc_over_num').textContent=over;
  if(s('pc_today_num')) s('pc_today_num').textContent=tod;
  if(s('pc_hot_num'))   s('pc_hot_num').textContent=unclass;
  if(s('pc_total_num')) s('pc_total_num').textContent=total;
}

// Highlight matching keyword in text
function hl(text, q){
  if(!q||!text) return text||'';
  try{
    const esc=q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
    return String(text).replace(new RegExp(`(${esc})`,'gi'),'<mark style="background:#FFF176;color:#5D4037;border-radius:2px;padding:0 1px">$1</mark>');
  }catch(e){return text||'';}
}

function render(){
  updateStats();updateTabs();
  const q=document.getElementById('searchInput').value.toLowerCase();
  let list=[...clients];
  if(curTab==='today') list=list.filter(c=>c.remind===TODAY);
  else if(curTab==='over') list=list.filter(c=>c.remind&&c.remind<TODAY);
  else if(curTab!=='all') list=list.filter(c=>c.heat===curTab);
  if(q) list=list.filter(c=>(c.name||'').toLowerCase().includes(q)||(c.phone||'').includes(q)||(c.addr||'').toLowerCase().includes(q)||(c.idno||'').toLowerCase().includes(q)||(c.note||'').toLowerCase().includes(q));
  // 縣市篩選
  if(selectedCities.size > 0) {
    list = list.filter(c => {
      const addr = c.addr || '';
      return ALL_CITIES.some(city => selectedCities.has(city) && (addr.startsWith(city) || addr.startsWith(city.replace('台','臺'))));
    });
  }
  const sortBy = document.getElementById('sortSelect')?.value || 'remind';

  // 地址縣市排序順序
  const cityOrder = ['台北市','臺北市','新北市','桃園市','基隆市','新竹市','新竹縣','苗栗縣','台中市','臺中市','彰化縣','南投縣','雲林縣','嘉義市','嘉義縣','台南市','臺南市','高雄市','屏東縣','宜蘭縣','花蓮縣','台東縣','臺東縣','澎湖縣','金門縣','連江縣'];
  function getCityOrder(addr) {
    const a = addr||'';
    for(let i=0; i<cityOrder.length; i++) {
      if(a.startsWith(cityOrder[i])) return i;
    }
    return 99;
  }

  list.sort((a,b)=>{
    // 置頂優先
    if(!!a.pinned !== !!b.pinned) return a.pinned ? -1 : 1;
    if(sortBy==='heat'){
      const hd=(hOrd[a.heat]??9)-(hOrd[b.heat]??9);
      if(hd!==0) return hd;
      const ra=rOrd[remSt(a.remind)]??4,rb=rOrd[remSt(b.remind)]??4;
      return ra-rb;
    } else if(sortBy==='deadline'){
      const da=a.remind||'9999-99-99',db=b.remind||'9999-99-99';
      if(da!==db) return da.localeCompare(db);
      return (hOrd[a.heat]??9)-(hOrd[b.heat]??9);
    } else if(sortBy==='created'){
      const da=a.createdAt||'',db=b.createdAt||'';
      return db.localeCompare(da);
    } else if(sortBy==='addr'){
      const ca=getCityOrder(a.addr), cb=getCityOrder(b.addr);
      if(ca!==cb) return ca-cb;
      return (a.addr||'').localeCompare(b.addr||'');
    } else {
      const ra=rOrd[remSt(a.remind)]??4,rb=rOrd[remSt(b.remind)]??4;
      if(ra!==rb)return ra-rb;
      // 同日期按時間排序
      if(a.remind===b.remind){
        const ta=a.remindTime||'',tb=b.remindTime||'';
        if(ta!==tb)return ta.localeCompare(tb);
      }
      return(hOrd[a.heat]??9)-(hOrd[b.heat]??9);
    }
  });
  const wrap=document.getElementById('listWrap');
  if(!list.length){wrap.innerHTML=`<div class="empty">🔍 查無資料</div>`;return;}
  wrap.innerHTML=list.map(c=>{
    let st=remSt(c.remind);
    // 今天的提醒，但時間已過 → 視為逾期
    if(st==='today'&&c.remindTime){
      const now=new Date();
      const [rh,rm]=(c.remindTime||'00:00').split(':').map(Number);
      const rt=new Date(); rt.setHours(rh,rm,0,0);
      if(now>rt) st='over';
    }
    const cls=st==='over'?'over':st==='today'?'today':st==='soon'?'soon':'';
    const lastLog=c.logs&&c.logs.length?c.logs[0]:null;
    const total=(c.bank||0)+(c.private||0);
    const heatCls=hCls[c.heat]||'';
    return`<div class="ccard ${cls} heat-${heatCls}${c.pinned?' pinned':''}" onclick="openEdit(${c.id})">
      <div class="ctop">
        <div style="flex:1;min-width:0"><div class="cname">${hl(c.name||'',q)}</div><div class="cphone" onclick="handlePhoneClick(event,'${c.phone||''}')" style="${c.phone?'cursor:pointer;text-decoration:underline dotted':''}">${hl(c.phone||'',q)}</div></div>
        <div style="display:flex;align-items:center;gap:5px;flex-shrink:0">
          <button onclick="togglePin(${c.id},event)" title="${c.pinned?'取消置頂':'置頂'}" style="background:none;border:none;cursor:pointer;font-size:14px;padding:2px;line-height:1;opacity:${c.pinned?'1':'.25'};transition:opacity .15s" onmouseover="this.style.opacity='1'" onmouseout="this.style.opacity='${c.pinned?'1':'.25'}'">📌</button>
          <span class="hbadge ${heatCls}">${c.heat}</span>
        </div>
      </div>
      <div class="cmeta">
        ${c.remind?remChip(c.remind,c.remindTime):''}
        ${c.bank?`<span class="mi">🏦銀行${c.bank}萬</span>`:''}
        ${c.legal?`<span class="mi">🏢法人${c.legal}萬</span>`:''}
        ${c.private?`<span class="mi" style="color:var(--red)">⚠️民間${c.private}萬</span>`:''}
        ${c.idno?`<span class="mi">🪪${hl(c.idno||'',q)}</span>`:''}
        ${c.companyRaw?`<span class="mi" style="color:var(--green)">🏢總檔</span>`:''}
        ${c.logs&&c.logs.length?`<span class="mi">💬${c.logs.length}筆</span>`:''}
      </div>
      ${c.remindNote?`<div style="font-size:11px;color:var(--accent);margin-bottom:4px">📌${c.remindNote}</div>`:''}
      ${c.addr?`<div style="font-size:11px;color:var(--t2);margin-bottom:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">📍${hl(c.addr||'',q)}</div>`:''}
      ${lastLog?`<div class="clog"><span style="color:var(--t3)">${lastLog.date}：</span>${hl(lastLog.text||'',q)}</div>`:''}
      ${c.remind?`<div style="display:flex;gap:6px;margin-top:8px">
        <button onclick="openCalendar(${c.id});event.stopPropagation()" style="flex:1;background:var(--abg);color:var(--accent);border:none;border-radius:var(--rs);padding:7px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit">📅 加入行事曆</button>
        ${(st==='over'||st==='today'||st==='soon')?`<button onclick="clearRemind(event,${c.id})" style="flex:1;background:var(--s2);color:var(--t2);border:none;border-radius:var(--rs);padding:7px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit">✕ 清除提醒</button>`:''}
      </div>`:''}
    </div>`;
  }).join('');
}

async function clearRemind(e, id) {
  e.stopPropagation(); // 防止觸發開啟客戶頁面
  const c = clients.find(x=>x.id===id);
  if(!c) return;
  c.remind = '';

  saveLocal();
  try { await pushToSheet(); showToast('✅ 已清除提醒'); }

  render();
}

function initNotifications() {

function checkReminders() {
  if(!('Notification' in window)||Notification.permission!=='granted') return;
  const now=new Date();
  const nowDate=now.toISOString().slice(0,10);
  const nowTime=`${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
  clients.forEach(c=>{
    if(c.remind===nowDate && c.remindTime===nowTime && !c._notified) {
      new Notification(`📞 聯絡 ${c.name}`,{body:c.remindNote||c.phone||'',icon:'📋'});
      c._notified=true;
    }
    if(c.remind!==nowDate) c._notified=false;
  });
}

function openCalendar(id) {
  const c = clients.find(x => x.id === id);
  if(!c || !c.remind) return;
  const date = c.remind.replace(/-/g, '');
  const time = c.remindTime || '09:00';
  const [h, m] = time.split(':');
  const endMin = parseInt(m) + 30;
  const endH = parseInt(h) + Math.floor(endMin / 60);
  const endM = endMin % 60;
  const start = `${date}T${h}${m}00`;
  const end = `${date}T${String(endH).padStart(2,'0')}${String(endM).padStart(2,'0')}00`;
  const title = encodeURIComponent(`📞 聯絡 ${c.name}${c.remindNote ? ' - ' + c.remindNote : ''}`);
  const details = encodeURIComponent(`電話：${c.phone || ''}\n備註：${c.remindNote || ''}\n地址：${c.addr || ''}`);
  window.open(`https://calendar.google.com/calendar/render?action=TEMPLATE&text=${title}&dates=${start}/${end}&details=${details}`, '_blank');
}

function renderPriceEval(c) {

  // Parse buildInfo
  const buildNoMatch = buildInfo.match(/([A-Z]_\d+_\d+_\d+-\d+)/);
  const buildNo = buildNoMatch ? buildNoMatch[1] : (c.buildNo||'');

  const sectionMatch = buildInfo.match(/[\u4e00-\u9fff]+[市縣]\s+[\u4e00-\u9fff]+[區鄉鎮市]\s+([\u4e00-\u9fff]+段[\u4e00-\u9fff]*)\s+\d+/);
  const section = sectionMatch ? sectionMatch[1] : (document.getElementById('fPurpose')?.value || c.purpose || '');

  const districtMatch = buildInfo.match(/[\u4e00-\u9fff]+[市縣]\s+([\u4e00-\u9fff]+[區鄉鎮市])/);
  const district = districtMatch ? districtMatch[1] : (addr.match(/[\u4e00-\u9fff]+[市縣]([\u4e00-\u9fff]+[區鄉鎮市])/)?.[1]||'');

  const floorsMatch = buildInfo.match(/0*(\d+)層/);
  const floors = floorsMatch ? parseInt(floorsMatch[1]) : '';

  const areaMatch = buildInfo.match(/（([\d.]+)坪）/);
  const area = areaMatch ? areaMatch[1] : (c.area||'');

  // 屋齡計算（民國年→西元）
  const yearMatch = buildInfo.match(/(\d+)年\d+月/);
  let age = '';
  if(yearMatch) {
    const rocYear = parseInt(yearMatch[1]);
    const builtYear = rocYear + 1911;
    age = new Date().getFullYear() - builtYear;

function calcEvalBuildArea(){
  const c = editId ? clients.find(x=>x.id===editId) : null;
  const totalArea = c ? (c.area || (c.mainArea||0)+(c.subArea||0)+(c.commonArea||0)) : 0;
  const parking = document.getElementById('ev_parking')?.value;
  const parkArea = parseFloat(document.getElementById('ev_parkarea')?.value)||0;
  const isIndependent = document.getElementById('ev_park_title')?.value === '獨立';
  let buildArea = totalArea;
  if(parking !== '無' && parkArea && !isIndependent){
    buildArea = Math.round((totalArea - parkArea)*100)/100;
  }
  if(document.getElementById('ev_buildarea')) document.getElementById('ev_buildarea').value = buildArea||'';
  calcTotal();
}

function calcTotal() {
  const unit = parseFloat(document.getElementById('ev_unitprice')?.value) || 0;
  const area = parseFloat(document.getElementById('ev_buildarea')?.value) || 0;
  if(unit && area) {
    document.getElementById('ev_total').value = Math.round(unit * area);
  }
}

function sSTab(i,el){

function sSTabTo(i){
  [0,1,2,3,4].forEach(j=>document.getElementById('sp'+j).style.display=j===i?'block':'none');
  document.querySelectorAll('.stab').forEach((t,j)=>t.classList.toggle('active',j===i));
}

function addLog(){
  const d=document.getElementById('fLogDate').value;
  const t=document.getElementById('fLogText').value.trim();
  if(!d||!t){alert('請填寫日期和記錄內容');return;}
  tempLogs.unshift({date:d,text:t});
  document.getElementById('fLogText').value='';
  renderLogs();
}
function removeLog(i){
  const log = tempLogs[i];
  if(log && editId){
    // 記錄刪除的 key，避免下次匯入又帶回來
    const c = clients.find(x=>x.id===editId);
    if(c){
      if(!c.deletedLogKeys) c.deletedLogKeys=[];
      const key = (log.date||'')+(log.text||'').slice(0,20);
      if(!c.deletedLogKeys.includes(key)) c.deletedLogKeys.push(key);
    }
  }
  tempLogs.splice(i,1);renderLogs();
}

    remind:document.getElementById('fRemind').value,
    remindTime:(()=>{const h=document.getElementById('fRemindHour').value;const m=document.getElementById('fRemindMin').value;return h&&m?`${h}:${m}`:''})(),
    remindNote:document.getElementById('fRemindNote').value.trim(),
    job:document.getElementById('fJob').value.trim(),
    jobYears:document.getElementById('fJobYears').value.trim(),
    finProofs:[...finProofs],
    note:document.getElementById('fNote').value.trim(),
    addr:document.getElementById('fAddr').value.trim(),
    area:parseFloat(document.getElementById('fArea').value)||0,
    mainArea:parseFloat(document.getElementById('fMainArea').value)||0,
    subArea:parseFloat(document.getElementById('fSubArea').value)||0,
    commonArea:parseFloat(document.getElementById('fCommonArea').value)||0,
    parkArea:parseFloat(document.getElementById('fParkArea').value)||0,
    bank:parseFloat(document.getElementById('fBank').value)||0,
    legal:parseFloat(document.getElementById('fLegal').value)||0,
    private:parseFloat(document.getElementById('fPrivate').value)||0,
    extraLoans:[...extraLoans],
    purpose:document.getElementById('fPurpose').value.trim(),
    buildNo:document.getElementById('fBuildNo').value.trim(),
    landNo:document.getElementById('fLandNo').value.trim(),
    driveUrl:document.getElementById('fDriveUrl').value.trim(),
    logs:[...tempLogs],
    updatedAt:TODAY,
  };
  if(editId){
    const idx=clients.findIndex(c=>c.id===editId);
    clients[idx]={...clients[idx],...data};
  } else {
    clients.push({id:nextId++,createdAt:TODAY,debtPhones:[],companyRaw:null,...data});
  }
  saveLocal();
  formDirty=false;
  try{await pushToSheet();showToast('✅ 已儲存並同步');}
  catch(e){showToast('💾 已存本地');}
  btn.disabled=false;btn.textContent='儲存';
  closeSheet();render();
}

async function deleteClient(){
  const c=clients.find(x=>x.id===editId);
  if(!confirm(`確定刪除「${c?.name}」？\n\n此客戶將加入黑名單，即使之後從總檔或 XLS 匯入也不會再出現。`))return;
  addToBlacklist(c);
  clients=clients.filter(x=>x.id!==editId);
  saveLocal();
  try{await pushToSheet();showToast('🗑️ 已刪除並加入黑名單');}
  catch(e){showToast('🗑️ 已刪除並加入黑名單（本地）');}
  closeSheet();render();
}

        <button onclick="removeFromBlacklist(${i})" style="flex-shrink:0;background:var(--gbg);color:var(--green);border:none;border-radius:var(--rs);padding:6px 11px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit">✅ 恢復</button>

    `).join('');

}
function closeBlacklist(){document.getElementById('blBg').classList.remove('open');}

function handleXls(file){
  if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'});
      const ws=wb.Sheets[wb.SheetNames[0]];
      xlsRows=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
      if(xlsRows.length<3){showToast('⚠️ 檔案內容為空');return;}
      const prev=document.getElementById('imPrev');
      prev.style.display='block';
      prev.innerHTML=`讀取成功！共 <b>${xlsRows.length-2}</b> 筆資料`;
      document.getElementById('imGo').disabled=false;
      document.getElementById('imDrop').querySelector('p').textContent=file.name;
    }catch(err){showToast('⚠️ 無法讀取檔案');}
  };
  reader.readAsArrayBuffer(file);
}

async function doImport(){
  if(xlsRows.length<3)return;
  processCompanyData(xlsRows);
  closeImport();
}

document.getElementById('sheetBg').addEventListener('click',e=>{if(e.target===document.getElementById('sheetBg'))closeSheet();});

async function clearAllData() {
  if(!confirm(`⚠️ 第一次確認\n\n即將清除全部 ${clients.length} 筆客戶資料。\n此動作無法復原，確定要繼續嗎？`)) return;
  if(!confirm(`🚨 第二次確認\n\n請再次確認：所有資料將被永久刪除，\n包含聯絡記錄、提醒設定等。\n\n確定清除？`)) return;
  clients = [];
  nextId = 1;
  saveLocal();
  try { await pushToSheet(); } catch(e) {}
  render();
  showToast('🗑️ 已清除所有資料');
}

// ── Drag to resize sheet ──────────────────────────────────
(function(){
  const handle = document.querySelector('.shandle');
  const sheet  = document.querySelector('.sheet');
  if(!handle || !sheet) return;
  let startY=0, startH=0, dragging=false;

  function onStart(e){
    dragging=true;
    startY = e.touches ? e.touches[0].clientY : e.clientY;
    startH = sheet.offsetHeight;
    handle.style.cursor='grabbing';
    document.body.style.userSelect='none';
  }
  function onMove(e){
    if(!dragging) return;
    const y = e.touches ? e.touches[0].clientY : e.clientY;
    const diff = startY - y;
    const newH = Math.min(Math.max(startH + diff, window.innerHeight*0.3), window.innerHeight*0.95);
    sheet.style.height = newH+'px';
  }
  function onEnd(){
    dragging=false;
    handle.style.cursor='grab';
    document.body.style.userSelect='';
  }

  handle.addEventListener('mousedown', onStart);
  handle.addEventListener('touchstart', onStart, {passive:true});
  document.addEventListener('mousemove', onMove);
  document.addEventListener('touchmove', onMove, {passive:true});
  document.addEventListener('mouseup', onEnd);
  document.addEventListener('touchend', onEnd);
})();
